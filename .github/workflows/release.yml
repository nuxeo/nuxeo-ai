name: Release and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from (e.g. 2025 ). Release version is auto-derived from pom.xml.'
        required: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
  cancel-in-progress: false

env:
  MAVEN_OPTS: >-
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
    -Daether.syncContext.named.time=600
    -Xms512m
    -Xmx1536m

permissions:
  contents: write
  packages: write

jobs:
  properties:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.env.outputs.VERSION }}
      BRANCH: ${{ steps.env.outputs.BRANCH }}
      TAG_EXISTS: ${{ steps.env.outputs.TAG_EXISTS }}
      JAVA_VERSION: ${{ steps.env.outputs.JAVA_VERSION }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - name: Resolve version info
        id: env
        run: |
          set -e

          BRANCH=""
          TAG_EXISTS=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${{ github.event.inputs.branch }}"

            if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              echo "::error::Branch '$BRANCH' does not exist in the remote repository."
              exit 1
            fi

            # Skip <parent> block to extract the project's own <version>
            POM_VERSION=$(sed -n '/<parent>/,/<\/parent>/d; s/.*<version>\(.*\)<\/version>.*/\1/p' pom.xml | head -1 | xargs)
            if [[ -z "$POM_VERSION" ]]; then
              echo "::error::Could not extract project version from pom.xml"
              exit 1
            fi

            if [[ ! "$POM_VERSION" =~ -SNAPSHOT$ ]]; then
              echo "::error::pom.xml version '$POM_VERSION' is not a SNAPSHOT version. The branch may have already been released or the version was not bumped after the last release."
              exit 1
            fi

            VERSION="${POM_VERSION%-SNAPSHOT}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Derived version '$VERSION' does not match expected format X.Y.Z"
              exit 1
            fi

            TAG_NAME="v${VERSION}"

            if git rev-parse "$TAG_NAME" > /dev/null 2>&1; then
              TAG_EXISTS=true
              if ! git merge-base --is-ancestor "${TAG_NAME}^{commit}" "origin/$BRANCH"; then
                echo "::error::Tag $TAG_NAME already exists, but its commit is not contained in branch '$BRANCH'."
                exit 1
              fi
            fi

          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_EXISTS=true

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag version '$VERSION' does not match expected format X.Y.Z"
              exit 1
            fi

            # Dereference commit for annotated tags; prefer 2025 > 2023 > main > master when on multiple branches
            BRANCHES=$(git branch -r --contains "${TAG_NAME}^{commit}" | grep -E 'origin/(2023|2025|main|master)' | sed 's/.*origin\///' | xargs || true)
            BRANCH=""
            MATCH_COUNT=0
            for candidate in $BRANCHES; do
              MATCH_COUNT=$((MATCH_COUNT + 1))
            done

            if [[ $MATCH_COUNT -eq 0 ]]; then
              echo "::error::Tag $TAG_NAME is not on any release branch. Aborting."
              exit 1
            elif [[ $MATCH_COUNT -eq 1 ]]; then
              BRANCH="$BRANCHES"
            else
              echo "::warning::Tag $TAG_NAME found on multiple branches: $BRANCHES"
              for preferred in 2025 2023 main master; do
                for candidate in $BRANCHES; do
                  if [[ "$candidate" == "$preferred" ]]; then
                    BRANCH="$candidate"
                    break 2
                  fi
                done
              done
              if [[ -z "$BRANCH" ]]; then
                echo "::error::Tag $TAG_NAME found on branches ($BRANCHES) but none matched the expected release branches."
                exit 1
              fi
            fi
          fi

          # 2025 → Java 21, everything else → Java 17
          case "$BRANCH" in
            2025*) JAVA_VERSION=21 ;;
            *)     JAVA_VERSION=17 ;;
          esac

          {
            echo "VERSION=$VERSION"
            echo "BRANCH=$BRANCH"
            echo "TAG_EXISTS=$TAG_EXISTS"
            echo "JAVA_VERSION=$JAVA_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "Release=$VERSION | Branch=$BRANCH | Java=$JAVA_VERSION | Tag exists=$TAG_EXISTS"

  create-tag:
    needs: properties
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.properties.outputs.TAG_EXISTS == 'false'
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
      BRANCH: ${{ needs.properties.outputs.BRANCH }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.BRANCH }}
          # GITHUB_TOKEN won't re-trigger on.push.tags, preventing recursive workflow runs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Maven build
        uses: nuxeo/gh-build-tools/.github/actions/setup-maven-build@v0.14.0
        with:
          java-version: ${{ needs.properties.outputs.JAVA_VERSION }}
          java-distribution: 'temurin'
          maven-settings: '.github/maven-settings.xml'
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}

      - name: Set release version, commit, and tag
        run: |
          TAG="v${{ env.VERSION }}"
          git config user.email "nuxeo-ai-bot@hyland.com"
          git config user.name "Nuxeo AI Bot"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping."
            exit 0
          fi

          mvn -B -nsu versions:set -DnewVersion="${{ env.VERSION }}" -DgenerateBackupPoms=false
          git add -A 'pom.xml' '**/pom.xml'
          git commit -m "release: set version to ${{ env.VERSION }}"

          git tag "${TAG}"
          if git push origin "refs/heads/${{ env.BRANCH }}" "refs/tags/${TAG}"; then
            echo "Tag ${TAG} created from release-version commit on branch ${{ env.BRANCH }}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} was created concurrently; treating as success."
            exit 0
          else
            echo "::error::Failed to push tag ${TAG}."
            exit 1
          fi
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}

  build-and-deploy:
    needs: [properties, create-tag]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.properties.result == 'success' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
    outputs:
      PACKAGE_NAME: marketplace-packages-${{ needs.properties.outputs.VERSION }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ needs.properties.outputs.VERSION }}
          fetch-depth: 0

      - name: Setup Maven build
        uses: nuxeo/gh-build-tools/.github/actions/setup-maven-build@v0.14.0
        with:
          java-version: ${{ needs.properties.outputs.JAVA_VERSION }}
          java-distribution: 'temurin'
          maven-settings: '.github/maven-settings.xml'
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}

      - name: Install system dependencies
        run: |
          sudo apt-get -y update && sudo apt-get install -y --no-install-recommends \
            perl \
            locales \
            pwgen \
            imagemagick \
            poppler-utils \
            libwpd-tools \
            exiftool \
            ghostscript \
            ffmpeg \
            x264

      - name: Build & Deploy
        id: build-deploy
        run: |
          set -e
          MAVEN_ARGS="-B -V -nsu -T 1C --no-transfer-progress -DgenerateBackupPoms=false -Dmaven.repo.local=$HOME/.m2/repository"

          mvn $MAVEN_ARGS clean deploy -DskipTests

          CORE_PACKAGE="nuxeo-ai-core-package/target/nuxeo-ai-core-${VERSION}.zip"
          if [[ ! -f "$CORE_PACKAGE" ]]; then
            echo "::error::Core package not found at $CORE_PACKAGE"
            exit 1
          fi
          echo "CORE_PACKAGE=$CORE_PACKAGE" >> "$GITHUB_OUTPUT"

          echo "Marketplace packages built:"
          find . -path '*/target/*package*.zip' -type f -exec ls -lh {} \;
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}

      - name: Upload marketplace packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-packages-${{ env.VERSION }}
          path: |
            nuxeo-ai-core-package/target/nuxeo-ai-core-${{ env.VERSION }}.zip
            addons/nuxeo-ai-aws-package/target/nuxeo-ai-aws-package-${{ env.VERSION }}.zip
            addons/nuxeo-ai-gcp-package/target/nuxeo-ai-gcp-package-${{ env.VERSION }}.zip
            addons/nuxeo-ai-image-quality-package/target/nuxeo-ai-image-quality-package-${{ env.VERSION }}.zip
            addons/nuxeo-ai-content-intelligence-package/target/nuxeo-ai-content-intelligence-package-${{ env.VERSION }}.zip
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

  publish-marketplace:
    needs: [properties, build-and-deploy]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.properties.result == 'success' &&
      needs.build-and-deploy.result == 'success'
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
    steps:
      - name: Download marketplace packages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-deploy.outputs.PACKAGE_NAME }}
          path: dist/

      - name: Publish to Nuxeo Marketplace (Production)
        run: |
          set -e
          found_any=false
          failed=false
          while IFS= read -r pkg; do
            found_any=true
            echo "Publishing: $(basename "$pkg")"
            STATUS_CODE=$(curl -i --silent --output /dev/null -w "%{http_code}" \
              -u "${{ secrets.CONNECT_USERNAME }}:${{ secrets.CONNECT_PASSWORD }}" \
              -F "package=@${pkg}" \
              "https://connect.nuxeo.com/nuxeo/site/marketplace/upload?batch=true")
            if [[ "$STATUS_CODE" != "200" ]]; then
              echo "::error::Failed to publish $(basename "$pkg") — HTTP $STATUS_CODE"
              failed=true
            fi
          done < <(find dist/ -name "*.zip" -type f)
          if [[ "$found_any" == "false" ]]; then
            echo "::error::No marketplace packages found in dist/"
            exit 1
          fi
          if [[ "$failed" == "true" ]]; then
            echo "::error::One or more marketplace uploads failed"
            exit 1
          fi

  create-github-release:
    needs: [properties, build-and-deploy]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.properties.result == 'success' &&
      needs.build-and-deploy.result == 'success'
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
    steps:
      - name: Download marketplace packages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-deploy.outputs.PACKAGE_NAME }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          name: Release ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: dist/**/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Nuxeo AI ${{ env.VERSION }}

            ### Installation
            ```
            nuxeoctl mp-install nuxeo-ai-core-${{ env.VERSION }}.zip
            ```

            ### What's Changed
            _Auto-generated release notes below_

  bump-version:
    needs: [properties, publish-marketplace, create-github-release]
    runs-on: ubuntu-latest
    # Proceed as long as marketplace publish succeeded; GitHub release failure is non-blocking
    if: |
      always() &&
      needs.properties.result == 'success' &&
      needs.publish-marketplace.result == 'success'
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
      BRANCH: ${{ needs.properties.outputs.BRANCH }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ needs.properties.outputs.BRANCH }}

      - name: Setup Maven build
        uses: nuxeo/gh-build-tools/.github/actions/setup-maven-build@v0.14.0
        with:
          java-version: ${{ needs.properties.outputs.JAVA_VERSION }}
          java-distribution: 'temurin'
          maven-settings: '.github/maven-settings.xml'
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}

      - name: Calculate and set next SNAPSHOT version
        run: |
          set -e

          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null | tail -n 1 | xargs)

          if [[ -z "$CURRENT_VERSION" || "$CURRENT_VERSION" == *"ERROR"* ]]; then
            echo "::error::Could not determine current version from pom.xml. Got: '$CURRENT_VERSION'"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$VERSION"
          NEXT_VERSION="${major}.${minor}.$((patch + 1))-SNAPSHOT"

          if [[ "$CURRENT_VERSION" != "$NEXT_VERSION" ]]; then
            echo "Bumping version: $CURRENT_VERSION → $NEXT_VERSION"
            mvn -B -nsu versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
            echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"
            echo "SHOULD_COMMIT=true" >> "$GITHUB_ENV"
          else
            echo "Version already at $NEXT_VERSION — no bump needed"
            echo "SHOULD_COMMIT=false" >> "$GITHUB_ENV"
          fi
        env:
          MVN_REPO_USERNAME: ${{ secrets.REPOSITORY_MANAGER_USERNAME }}
          MVN_REPO_PASSWORD: ${{ secrets.REPOSITORY_MANAGER_PASSWORD }}

      - name: Commit and push version bump
        if: env.SHOULD_COMMIT == 'true'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: bump version to ${{ env.NEXT_VERSION }} after release ${{ env.VERSION }}"
          branch: ${{ env.BRANCH }}
          file_pattern: 'pom.xml **/pom.xml'
          commit_user_email: nuxeo-ai-bot@hyland.com
          commit_user_name: Nuxeo AI Bot
          