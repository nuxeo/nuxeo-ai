name: Docker Build Preview
description: Build & push preview Docker image from packaged ZIPs
inputs:
  version:
    description: Version used for tagging and ZIP file paths
    required: true
  registry:
    description: Docker registry URL
    required: true
  docker-username:
    description: Docker registry username
    required: true
  docker-password:
    description: Docker registry password
    required: true
  repository:
    description: Docker repository name
    required: true
  nuxeo-clid:
    description: Nuxeo CLID (CLID as a string)
    required: true

runs:
  using: composite
  steps:
    - name: Prepare Docker build context
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        echo "Preparing Docker context with version: ${VERSION}"

        mkdir -p docker

        # Core package (required)
        if [[ -f "nuxeo-ai-core-package/target/nuxeo-ai-core-${VERSION}.zip" ]]; then
          cp "nuxeo-ai-core-package/target/nuxeo-ai-core-${VERSION}.zip" docker/
        else
          echo "ERROR: Core package not found: nuxeo-ai-core-package/target/nuxeo-ai-core-${VERSION}.zip"
          exit 1
        fi

        # Optional addon packages (copy if present)
        cp addons/nuxeo-ai-image-quality-package/target/*package*.zip docker/ 2>/dev/null || echo "image-quality package not found"
        cp addons/nuxeo-ai-aws-package/target/*package*.zip docker/ 2>/dev/null || echo "aws package not found"
        cp addons/nuxeo-ai-gcp-package/target/*package*.zip docker/ 2>/dev/null || echo "gcp package not found"
        cp addons/nuxeo-ai-content-intelligence-package/target/*package*.zip docker/ 2>/dev/null || echo "content-intelligence package not found"

        echo "Docker context contents:"
        ls -al docker || true

    - name: Build Nuxeo image
      uses: nuxeo/gh-build-tools/.github/actions/nuxeo-docker-build@v0.8.0
      with:
        base-registry-username: ${{ inputs.docker-username }}
        base-registry-password: ${{ inputs.docker-password }}
        nuxeo-connect-modules: nuxeo-web-ui replace-administrator-user-1.0.0
        nuxeo-clid: ${{ inputs.nuxeo-clid }}
        nuxeo-local-modules-path: docker
        os-packages: |
          awscli
          ghostscript
          libwpd-tools
          perl-Archive-Zip
          perl-Image-ExifTool
          poppler-utils
          libreoffice-calc
          libreoffice-headless
          libreoffice-impress
          curl
          unzip
          zip
          ffmpeg-nuxeo
          ccextractor-nuxeo
        os-packages-user: ${{ inputs.docker-username }}
        os-packages-token: ${{ inputs.docker-password }}
        image-name: ${{ inputs.repository }}
        image-tag: ${{ inputs.version }}.${{ github.run_id }}
        image-title: "Nuxeo AI Core"
        registry: ${{ inputs.registry }}
        registry-username: ${{ inputs.docker-username }}
        registry-password: ${{ inputs.docker-password }}
        push-image: "true"
